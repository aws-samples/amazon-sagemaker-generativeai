# Cosmos Transfer 2.5 — Two-Stage Multiview Inference Job
#
# Stage 2: Takes single-view outputs from the fine-tuned model and
# extends them to 7-camera surround views using the BASE multiview model.
#
# Prerequisites:
#   - Stage 1 (single-view training + inference) completed
#   - Single-view generated videos on FSx at /fsx/output/singleview_inference/
#   - Multiview specs generated by generate_multiview_specs_from_singleview.py
#
# Apply:
#   kubectl apply -f multiview-inference-job.yaml
#
# Monitor:
#   kubectl logs -f cosmos-multiview-inference

apiVersion: v1
kind: Pod
metadata:
  name: cosmos-multiview-inference
  namespace: default
spec:
  restartPolicy: Never
  nodeSelector:
    node.kubernetes.io/instance-type: ml.p5.48xlarge
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  containers:
    - name: multiview-inference
      image: 783764584149.dkr.ecr.us-west-2.amazonaws.com/cosmos-transfer-training:latest
      imagePullPolicy: Always
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -e
          cd /workspace/cosmos-transfer2.5
          export PATH="$(pwd)/.venv/bin:$PATH"
          source .venv/bin/activate

          # Set LD_LIBRARY_PATH for transformer_engine
          NVIDIA_CUBLAS_LIB=$(find .venv -path "*/nvidia/cublas/lib" -type d 2>/dev/null | head -1)
          NVIDIA_CUDNN_LIB=$(find .venv -path "*/nvidia/cudnn/lib" -type d 2>/dev/null | head -1)
          export LD_LIBRARY_PATH="${NVIDIA_CUBLAS_LIB:+$NVIDIA_CUBLAS_LIB:}${NVIDIA_CUDNN_LIB:+$NVIDIA_CUDNN_LIB:}/usr/local/cuda/lib64"

          # HuggingFace login for model download
          if [ -n "${HF_TOKEN}" ]; then
              huggingface-cli login --token ${HF_TOKEN} --add-to-git-credential
          fi

          echo "============================================"
          echo " Stage 2: Multiview Inference (Base Model)"
          echo " Extending single-view to 7-camera surround"
          echo "============================================"

          # Step 1: Generate multiview specs from single-view outputs
          echo "=== Generating multiview specs ==="
          pip install -q opencv-python-headless numpy tqdm
          python /workspace/scripts/generate_multiview_specs_from_singleview.py \
              --singleview-output /fsx/output/singleview_inference \
              --control-dir /fsx/datasets/drive_dreams_cosmos_dataset/control_input_hdmap_bbox \
              --caption-dir /fsx/datasets/drive_dreams_cosmos_dataset/captions \
              --output-dir /fsx/output/multiview_specs

          # Step 2: Run multiview inference on each spec using BASE model
          echo "=== Running multiview inference ==="
          SPEC_COUNT=$(find /fsx/output/multiview_specs -name "multiview_spec.json" | wc -l)
          echo "Found $SPEC_COUNT multiview specs"

          PROCESSED=0
          for spec in /fsx/output/multiview_specs/*/multiview_spec.json; do
              CLIP_NAME=$(basename $(dirname $spec))
              echo ""
              echo "--- Processing $CLIP_NAME ($((PROCESSED+1))/$SPEC_COUNT) ---"

              torchrun --nproc_per_node=8 --master_port=12341 \
                  -m examples.multiview \
                  -i "$spec" \
                  -o "/fsx/output/multiview_output/$CLIP_NAME" \
                  --experiment transfer2_auto_multiview_post_train_example \
                  --disable-guardrails \
                  2>&1 || echo "[WARN] Failed for $CLIP_NAME, continuing..."

              PROCESSED=$((PROCESSED+1))
          done

          echo ""
          echo "=== Multiview inference complete ==="
          echo "Processed: $PROCESSED/$SPEC_COUNT clips"
          echo "Output: /fsx/output/multiview_output/"
      env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: "expandable_segments:True"
        - name: NCCL_DEBUG
          value: "WARN"
        - name: WANDB_MODE
          value: "disabled"
      resources:
        limits:
          nvidia.com/gpu: 8
        requests:
          nvidia.com/gpu: 8
          cpu: "90"
          memory: "700Gi"
      volumeMounts:
        - name: fsx-volume
          mountPath: /fsx
        - name: scripts
          mountPath: /workspace/scripts
        - name: dshm
          mountPath: /dev/shm
  volumes:
    - name: fsx-volume
      persistentVolumeClaim:
        claimName: fsx-claim
    - name: scripts
      configMap:
        name: multiview-scripts
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: "128Gi"
