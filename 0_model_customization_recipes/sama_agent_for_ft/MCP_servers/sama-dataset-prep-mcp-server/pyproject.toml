[project]
name = "sama-dataset-prep-mcp-server"
version = "0.1.0"
description = "SAMA Dataset Prep MCP Server - Format datasets for SFT/GRPO across modalities and upload to S3"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.9.2",
    "pydantic>=2.10.6",
    "huggingface-hub>=0.16.0",
    "datasets>=2.14.0",
    "boto3>=1.26.0",
    "sagemaker>=2.200.0",
    "mcp[cli]>=1.6.0"
]

[project.scripts]
"sama-dataset-prep-mcp-server" = "sama_dataset_prep_mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sama_dataset_prep_mcp_server"]
