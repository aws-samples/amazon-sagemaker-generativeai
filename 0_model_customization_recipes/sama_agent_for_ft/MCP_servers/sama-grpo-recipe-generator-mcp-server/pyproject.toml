[project]
name = "sama-grpo-recipe-generator-mcp-server"
version = "0.1.0"
description = "SAMA GRPO Recipe Generator MCP Server - Generate YAML recipes for GRPO RLVR training"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.9.2",
    "pydantic>=2.10.6",
    "mcp[cli]>=1.6.0"
]

[project.scripts]
"sama-grpo-recipe-generator-mcp-server" = "sama_grpo_recipe_generator_mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sama_grpo_recipe_generator_mcp_server"]
