[project]
name = "sama-sft-training-workflow-mcp-server"
version = "0.1.0"
description = "SAMA SFT Training Workflow MCP Server - Generate SageMaker training scripts from templates"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.9.2",
    "pydantic>=2.10.6",
    "mcp[cli]>=1.6.0"
]

[project.scripts]
"sama-sft-training-workflow-mcp-server" = "sama_sft_training_workflow_mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sama_sft_training_workflow_mcp_server"]
